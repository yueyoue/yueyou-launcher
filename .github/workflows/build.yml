name: Build & Release (Nuitka)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build exe with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --windows-console-mode=disable `
            --windows-product-name="悦游网单游戏启动器" `
            --windows-product-version=2.0.0.0 `
            --windows-file-description="悦游网单游戏启动器" `
            --windows-company-name="Yueyoue" `
            --output-filename="悦游网单游戏启动器.exe" `
            --enable-plugin=tk-inter `
            --assume-yes-for-downloads `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yueyou-launcher
          path: 悦游网单游戏启动器.exe

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 悦游网单游戏启动器.exe
          generate_release_notes: true
