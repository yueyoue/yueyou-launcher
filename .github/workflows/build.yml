name: Build Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build self-contained exe
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o output

      - name: Rename output
        shell: powershell
        run: |
          Rename-Item output/YueyouLauncher.exe YueyouLauncher_amd64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YueyouLauncher_amd64
          path: output/YueyouLauncher_amd64.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/YueyouLauncher_amd64/YueyouLauncher_amd64.exe
          generate_release_notes: true
