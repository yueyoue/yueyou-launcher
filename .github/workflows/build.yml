name: Build Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: amd64
          - goarch: 386
            suffix: x86

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Install garble (anti-decompilation)
        run: go install mvdan.cc/garble@latest

      - name: Generate go.sum
        run: go mod tidy

      - name: Generate resources
        run: go-winres make --product-version=1.0.0 --file-version=1.0.0

      - name: Build with garble obfuscation
        shell: cmd
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: |
          for /f %%i in ('git describe --tags --abbrev^=0') do set VER=%%i
          garble -literals -tiny -seed=random build -ldflags="-s -w -H windowsgui -X main.Version=%VER%" -o YueyouLauncher_${{ matrix.suffix }}.exe .

      - name: Compress with UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: YueyouLauncher_${{ matrix.suffix }}.exe
          args: --best

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YueyouLauncher_${{ matrix.suffix }}
          path: YueyouLauncher_${{ matrix.suffix }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/YueyouLauncher_amd64/YueyouLauncher_amd64.exe
            artifacts/YueyouLauncher_x86/YueyouLauncher_x86.exe
          generate_release_notes: true
