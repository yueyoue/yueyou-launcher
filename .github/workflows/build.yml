name: Build Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, 386]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Generate resources
        run: go-winres make --product-version=1.0.0 --file-version=1.0.0

      - name: Build (${{ matrix.goarch }})
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w -H windowsgui -X main.Version=${{ github.ref_name }}" -o YueyouLauncher_${{ matrix.goarch }}.exe .

      - name: Compress with UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: YueyouLauncher_${{ matrix.goarch }}.exe
          args: --best

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YueyouLauncher_${{ matrix.goarch }}
          path: YueyouLauncher_${{ matrix.goarch }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/YueyouLauncher_amd64/YueyouLauncher_amd64.exe
            artifacts/YueyouLauncher_386/YueyouLauncher_386.exe
          generate_release_notes: true
