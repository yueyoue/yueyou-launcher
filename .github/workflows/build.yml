name: Build Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild YueyouLauncher.sln /p:Configuration=Release /p:Platform="Any CPU" /restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YueyouLauncher
          path: YueyouLauncher/bin/Release/YueyouLauncher.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/YueyouLauncher/YueyouLauncher.exe
          generate_release_notes: true
